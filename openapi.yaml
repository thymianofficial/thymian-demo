openapi: 3.0.3
info:
  title: Space Launch System API
  description: API for managing astronauts and launches
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /astronauts:
    get:
      summary: List all astronauts
      operationId: listAstronauts
      tags:
        - Astronauts
      security:
        - basicAuth: [ ]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
          description: Maximum number of astronauts to return
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of astronauts to skip
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Astronaut'
        '401':
          description: Unauthorized
    post:
      summary: Create a new astronaut
      operationId: createAstronaut
      tags:
        - Astronauts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AstronautInput'
      responses:
        '201':
          description: Astronaut created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Astronaut'
        '400':
          description: Invalid input
        '409':
          description: Astronaut with this email already exists

  /astronauts/{id}:
    get:
      summary: Get an astronaut by ID
      operationId: getAstronaut
      tags:
        - Astronauts
      security:
        - basicAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Astronaut'
        '401':
          description: Unauthorized
        '404':
          description: Astronaut not found
    put:
      summary: Update an astronaut
      description: Astronauts are only allowed to update themselves.
      operationId: updateAstronaut
      tags:
        - Astronauts
      security:
        - basicAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AstronautInput'
      responses:
        '200':
          description: Astronaut updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Astronaut'

        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Unauthorized to update this astronaut
        '404':
          description: Astronaut not found
        '409':
          description: Astronaut with this email already exists
    delete:
      summary: Delete an astronaut
      description: Astronauts are only allowed to delete themselves.
      operationId: deleteAstronaut
      tags:
        - Astronauts
      security:
        - basicAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Astronaut deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Unauthorized to delete this astronaut
        '404':
          description: Astronaut not found

  /launches:
    get:
      summary: List all launches
      operationId: listLaunches
      tags:
        - Launches
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Launch'
    post:
      summary: Create a new launch
      description: Only astronauts with the commander role can create launches
      operationId: createLaunch
      tags:
        - Launches
      security:
        - basicAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchInput'
      responses:
        '201':
          description: Launch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Launch'
        '401':
          description: Unauthorized
        '403':
          description: Unauthorized to create this launch
        '400':
          description: Invalid input

  /launches/{id}/crew-members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: List all crew members for a launch
      operationId: listLaunchCrewMembers
      tags:
        - Launches
      security:
        - basicAuth: [ ]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Astronaut'
        '404':
          description: Launch not found
        '401':
          description: Unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
    post:
      summary: Add a crew member to a launch
      operationId: addLaunchCrewMember
      description: Only astronauts with the commander role can add crew members to launches.
      tags:
        - Launches
      security:
        - basicAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - 'astronaut_id'
              properties:
                astronaut_id:
                  type: integer
      responses:
        201:
          description: Successful response
        400:
          description: Invalid input
        401:
          description: Unauthorized
        403:
          description: Unauthorized to add this astronaut to this launch
        404:
          description: Launch not found
        409:
          description: Astronaut already assigned to this launch

  /launches/{id}:
    get:
      summary: Get a launch by ID
      operationId: getLaunch
      tags:
        - Launches
      security:
        - basicAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Launch'
        '401':
          description: Unauthorized
        '404':
          description: Launch not found
    put:
      summary: Update a launch
      description: Launches are only allowed to be updated by their creators.
      operationId: updateLaunch
      tags:
        - Launches
      security:
        - basicAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchInput'
      responses:
        '200':
          description: Launch updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Launch'
        '401':
          description: Unauthorized
        '403':
          description: Unauthorized to update this launch'
        '404':
          description: Launch not found
        '400':
          description: Invalid input
    delete:
      summary: Delete a launch
      description: Launches are only allowed to be deleted by their creators.
      operationId: deleteLaunch
      tags:
        - Launches
      security:
        - basicAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Launch deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Unauthorized to delete this launch
        '404':
          description: Launch not found

  /rocket_types:
    get:
      summary: List all rocket types
      operationId: listRocketTypes
      tags:
        - RocketTypes
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RocketType'

components:
  schemas:
    Astronaut:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        role_id:
          type: integer
        email:
          type: string
      required:
        - email
        - id
        - name
        - role_id

    AstronautInput:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - Commander
            - Pilot
            - Specialist
            - PayloadMaster
      required:
        - name
        - password
        - role
        - email

    Launch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        mission_name:
          type: string
        launch_date:
          type: string
          format: date
        rocket_type_id:
          type: integer
        is_manned:
          type: boolean
          default: false
        created_by:
          $ref: '#/components/schemas/Astronaut'
      required:
        - id
        - mission_name
        - launch_date
        - rocket_type_id
        - is_manned
        - created_by
    LaunchInput:
      type: object
      properties:
        mission_name:
          type: string
        launch_date:
          type: string
          format: date
        rocket_type_id:
          type: integer
        is_manned:
          type: boolean
          default: false
      required:
        - mission_name
        - launch_date
        - rocket_type_id
        - is_manned

    RocketType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
      required:
        - id
        - name

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
